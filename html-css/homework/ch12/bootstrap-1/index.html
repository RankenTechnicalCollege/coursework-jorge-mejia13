<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 1 - Business Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container">
        <h1 class="mb-3 mt-3">Business Form</h1>
        <form class="mb-4">
            <!-- contact info -->
            <fieldset class="mb-4">
                <legend>Contact Info</legend>
                <div class="mb-3">
                    <label for="givenName" class="form-label">Given Name</label>
                    <input type="text" class="form-control" id="givenName" required>
                </div>
                <div class="mb-3">
                    <label for="familyName" class="form-label">Family Name</label>
                    <input type="text" class="form-control" id="familyName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="emailCheck">Confirm Email</label>
                    <input type="email" class="form-control" id="emailCheck" required>
                </div>
            </fieldset>

            <!-- account credentials -->
            <fieldset class="mb-4">
                <legend>Account Credentials</legend>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </div>
            </fieldset>

            <!-- payment information -->
            <fieldset class="mb-4">
                <legend>Payment Information</legend>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="ccNumber" class="form-label">Credit Card Number</label>
                        <input type="number" class="form-control" id="ccNumber" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="expDate" class="form-label">Expiration Date</label>
                        <input type="date" class="form-control" id="expDate" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cscCode" class="form-label">CSC Code</label>
                        <input type="number" class="form-control" id="cscCode" required>
                    </div>
                </div>
            </fieldset>

            <!-- billing address -->
            <fieldset class="mb-4">
                <legend>Billing Address</legend>
                <div class="mb-3">
                    <label for="street" class="form-label">Street Address</label>
                    <input type="text" class="form-control" id="street" required>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="street2" class="form-label">Street Address 2</label>
                        <input type="text" class="form-control" id="street2" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="state" class="form-label">State</label>
                        <select id="state" class="form-select" aria-label="Default select example">
                            <option selected value="mo">MO</option>
                            <option value="il">IL</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="zip" class="form-label">Zipcode</label>
                        <input type="number" class="form-control" id="zip" required>
                    </div>
                </div>
            </fieldset>

            <!-- shipping address -->
            <fieldset class="mb-4">
                <legend>Shipping Address</legend>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">Same as billing address</label>
                </div>
                 <div class="mb-3">
                    <label for="shippingStreet" class="form-label">Street Address</label>
                    <input type="text" class="form-control" id="shippingStreet" required>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="shippingStreet2" class="form-label">Street Address 2</label>
                        <input type="text" class="form-control" id="shippingStreet2" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="shippingCity" class="form-label">City</label>
                        <input type="text" class="form-control" id="shippingCity" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="shippingState" class="form-label">State</label>
                        <select id="shippingState" class="form-select" aria-label="Default select example">
                            <option selected value="mo">MO</option>
                            <option value="il">IL</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="shippingZip" class="form-label">Zipcode</label>
                        <input type="number" class="form-control" id="shippingZip" required>
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
