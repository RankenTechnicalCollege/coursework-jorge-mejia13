<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header>
        <h1>Ground Beef and White Rice with Broccoli</h1>
    </header>

    <main>
        <ul>
            <li>90/10 ground beef</li>
            <li>White rice and rice maker</li>
            <li>Broccoli</li>
        </ul>

        <ol>
            <li>Cook ground beef while making white rice in the rice maker</li>
            <li>Once beef is about done add Broccoli</li>
            <li>After the Broccoli is cooked add white rice</li>
            <li>Mix together and enjoy!</li>
        </ol>
    </main>
</body>
