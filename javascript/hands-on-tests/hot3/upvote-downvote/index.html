<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="container py-5">
        <div class="card" style="width: 18rem;">
            <img src="..." class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Nike Shoes</h5>
                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content</p>
                <div class="btn btn-primary" id="upvote">Upvote </div>
                <div class="btn btn-secondary" id="downvote">Downvote </div>

                <ul class="list-group mt-5">
                    <li class="list-group-item">Upvotes: <span id="upvotes"></span></li>
                    <li class="list-group-item">Downvote:<span id="downvotes"></span></li>
                    <li class="list-group-item">Total Votes:<span id="totalvotes"></span></li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
